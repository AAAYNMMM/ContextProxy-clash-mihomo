name: Validate and apply performance patch

on:
  pull_request:
    branches:
      - codex/performance-validation-base
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Apply patch
        id: apply_patch
        continue-on-error: true
        shell: pwsh
        run: |
          python tools/apply_performance_patch.py *>&1 | Tee-Object "$env:RUNNER_TEMP\performance-patch-output.txt"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Publish patch failure
        if: steps.apply_patch.outcome == 'failure'
        shell: pwsh
        run: |
          git reset --hard HEAD
          Copy-Item "$env:RUNNER_TEMP\performance-patch-output.txt" performance-patch-error.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add performance-patch-error.txt
          git commit -m "ci: record performance patch failure"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
          exit 1

      - name: Format Go
        shell: pwsh
        run: gofmt -w core/main.go

      - name: Install Python test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest PyYAML requests psutil PySide6

      - name: Python syntax check
        shell: pwsh
        run: python -m compileall -q backend gui

      - name: Python tests
        shell: pwsh
        run: |
          if (Test-Path tests) {
            python -m pytest -q
          } else {
            Write-Host "No Python tests directory; syntax check completed."
          }

      - name: Go tests
        shell: pwsh
        working-directory: core
        run: go test ./...

      - name: Remove temporary patch machinery
        shell: pwsh
        run: |
          Remove-Item tools/apply_performance_patch.py
          Remove-Item .github/workflows/performance-patch.yml
          Remove-Item performance-patch-error.txt -ErrorAction SilentlyContinue
          if ((Test-Path tools) -and -not (Get-ChildItem tools -Force)) {
            Remove-Item tools
          }

      - name: Commit optimized implementation
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "perf: smooth GUI polling and proxy hot paths"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
