name: Review and verify performance smoothness

on:
  pull_request:
    branches:
      - codex/performance-validation-base
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  review-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Apply final review fixes
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              if new in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one match, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          main = Path("gui/main_window.py")
          replace_once(
              main,
              "from gui.dashboard_store import count_active_connections, get_core_events, get_dashboard_stats",
              "from gui.dashboard_store import get_dashboard_stats",
          )
          replace_once(main, "    get_backend_error,\n", "")

          replace_once(
              main,
              '''        if self.node_pool_table:
              table = self.node_pool_table
              table.setUpdatesEnabled(False)
              try:
          ''',
              '''        if self.node_pool_table:
              table = self.node_pool_table
              previous_updates = table.updatesEnabled()
              table.setUpdatesEnabled(False)
              try:
          ''',
          )
          replace_once(
              main,
              '''            finally:
                  table.setUpdatesEnabled(True)
              if self.group_node_table:
                  table = self.group_node_table
                  table.setUpdatesEnabled(False)
                  try:
          ''',
              '''            finally:
                  table.setUpdatesEnabled(previous_updates)
              if self.group_node_table:
                  table = self.group_node_table
                  previous_updates = table.updatesEnabled()
                  table.setUpdatesEnabled(False)
                  try:
          ''',
          )
          replace_once(
              main,
              '''            finally:
                  table.setUpdatesEnabled(True)

              def _finish_node_delay_test(self, result: dict):
          ''',
              '''            finally:
                  table.setUpdatesEnabled(previous_updates)

              def _finish_node_delay_test(self, result: dict):
          ''',
          )

          core = Path("core/main.go")
          replace_once(
              core,
              '''\twriter := newTimedConnWriter(dst, settings.writeTimeout)
          \tpendingBytes := int64(0)
          \tlastStatsFlush := time.Now()
          \tflushStats := func(force bool) {
          \t\tif pendingBytes == 0 {
          \t\t\treturn
          \t\t}
          \t\tnow := time.Now()
          ''',
              '''\twriter := newTimedConnWriter(dst, settings.writeTimeout)
          \tconnInfo := c.getConn(id)
          \tpendingBytes := int64(0)
          \tlastStatsFlush := time.Now()
          \tflushStats := func(force bool, now time.Time) {
          \t\tif pendingBytes == 0 {
          \t\t\treturn
          \t\t}
          ''',
          )
          replace_once(core, "\t\tflushStats(true)\n", "\t\tflushStats(true, time.Now())\n")
          replace_once(
              core,
              '''\t\t\tpendingBytes += int64(n)
          \t\t\tflushStats(false)
          \t\t\twindowBytes += int64(n)
          \t\t\tnow := time.Now()
          ''',
              '''\t\t\tpendingBytes += int64(n)
          \t\t\twindowBytes += int64(n)
          \t\t\tnow := time.Now()
          \t\t\tif connInfo.ID != 0 {
          \t\t\t\tconnInfo.LastActiveAt.Store(now.UnixNano())
          \t\t\t}
          \t\t\tflushStats(false, now)
          ''',
          )
          '@ | Set-Content "$env:RUNNER_TEMP\final-review-fixes.py" -Encoding utf8
          python "$env:RUNNER_TEMP\final-review-fixes.py"

      - name: Format Go
        shell: pwsh
        run: gofmt -w core/main.go

      - name: Install Python test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest PyYAML requests psutil PySide6

      - name: Python syntax check
        shell: pwsh
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}\contextproxy-pycache
        run: python -m compileall -q backend gui

      - name: Python tests
        shell: pwsh
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}\contextproxy-pycache
        run: |
          if (Test-Path tests) {
            python -m pytest -q
          } else {
            Write-Host "No Python tests directory; syntax check completed."
          }

      - name: Go tests
        shell: pwsh
        working-directory: core
        run: go test ./...

      - name: Commit reviewed implementation
        shell: pwsh
        run: |
          if (-not (git status --porcelain)) {
            Write-Host "No review fixes to commit."
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gui/main_window.py core/main.go
          git commit -m "perf: preserve activity accuracy and UI state"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
