name: Review and verify performance smoothness

on:
  pull_request:
    branches:
      - codex/performance-validation-base
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  review-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Apply final review fixes
        id: review_fixes
        continue-on-error: true
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding="utf-8")
              if new:
                  if new in text:
                      print(f"already applied: {label}")
                      return
              elif old not in text:
                  print(f"already applied: {label}")
                  return
              count = text.count(old)
              print(f"{label}: matches={count}")
              if count != 1:
                  raise RuntimeError(f"{path}: {label} expected one match, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          main = Path("gui/main_window.py")
          replace_once(
              main,
              "from gui.dashboard_store import count_active_connections, get_core_events, get_dashboard_stats",
              "from gui.dashboard_store import get_dashboard_stats",
              "dashboard imports",
          )
          replace_once(main, "    get_backend_error,\n", "", "backend error import")

          core = Path("core/main.go")
          replace_once(
              core,
              "\twriter := newTimedConnWriter(dst, settings.writeTimeout)\n\tpendingBytes := int64(0)\n\tlastStatsFlush := time.Now()\n\tflushStats := func(force bool) {\n\t\tif pendingBytes == 0 {\n\t\t\treturn\n\t\t}\n\t\tnow := time.Now()\n",
              "\twriter := newTimedConnWriter(dst, settings.writeTimeout)\n\tconnInfo := c.getConn(id)\n\tpendingBytes := int64(0)\n\tlastStatsFlush := time.Now()\n\tflushStats := func(force bool, now time.Time) {\n\t\tif pendingBytes == 0 {\n\t\t\treturn\n\t\t}\n",
              "relay batch closure",
          )
          replace_once(
              core,
              "\t\tflushStats(true)\n",
              "\t\tflushStats(true, time.Now())\n",
              "relay final flush",
          )
          replace_once(
              core,
              "\t\t\tpendingBytes += int64(n)\n\t\t\tflushStats(false)\n\t\t\twindowBytes += int64(n)\n\t\t\tnow := time.Now()\n",
              "\t\t\tpendingBytes += int64(n)\n\t\t\twindowBytes += int64(n)\n\t\t\tnow := time.Now()\n\t\t\tif connInfo.ID != 0 {\n\t\t\t\tconnInfo.LastActiveAt.Store(now.UnixNano())\n\t\t\t}\n\t\t\tflushStats(false, now)\n",
              "relay activity touch",
          )
          '@ | Set-Content "$env:RUNNER_TEMP\final-review-fixes.py" -Encoding utf8
          python "$env:RUNNER_TEMP\final-review-fixes.py" *>&1 | Tee-Object "$env:RUNNER_TEMP\review-fixes.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish review-fix failure
        if: steps.review_fixes.outcome == 'failure'
        shell: pwsh
        run: |
          git reset --hard HEAD
          Copy-Item "$env:RUNNER_TEMP\review-fixes.txt" performance-review-error.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add performance-review-error.txt
          git commit -m "ci: record final review patch failure"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
          exit 1

      - name: Format Go
        if: steps.review_fixes.outcome == 'success'
        shell: pwsh
        run: gofmt -w core/main.go

      - name: Install Python test dependencies
        if: steps.review_fixes.outcome == 'success'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest PyYAML requests psutil PySide6

      - name: Python syntax check
        if: steps.review_fixes.outcome == 'success'
        shell: pwsh
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}\contextproxy-pycache
        run: python -m compileall -q backend gui

      - name: Python tests
        if: steps.review_fixes.outcome == 'success'
        shell: pwsh
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}\contextproxy-pycache
        run: |
          if (Test-Path tests) {
            python -m pytest -q
          } else {
            Write-Host "No Python tests directory; syntax check completed."
          }

      - name: Go tests
        if: steps.review_fixes.outcome == 'success'
        shell: pwsh
        working-directory: core
        run: go test ./...

      - name: Commit reviewed implementation
        if: steps.review_fixes.outcome == 'success'
        shell: pwsh
        run: |
          Remove-Item performance-review-error.txt -ErrorAction SilentlyContinue
          if (-not (git status --porcelain)) {
            Write-Host "No review fixes to commit."
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gui/main_window.py core/main.go
          git add -u -- performance-review-error.txt
          git commit -m "chore: remove final review diagnostics"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
