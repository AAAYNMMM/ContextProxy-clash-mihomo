<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>ContextProxy 扩展设置</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif;
      font-size: 14px;
      color: #111827;
      background: #f5f7fb;
    }

    body {
      margin: 0;
      padding: 32px;
    }

    main {
      width: 520px;
      max-width: 100%;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 24px;
      box-sizing: border-box;
    }

    h1 {
      margin: 0 0 20px;
      font-size: 22px;
      line-height: 1.3;
    }

    label {
      display: block;
      margin: 14px 0 6px;
      font-weight: 600;
    }

    input {
      width: 100%;
      height: 36px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 0 10px;
      box-sizing: border-box;
      font: inherit;
    }

    input:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 22px;
    }

    button {
      height: 34px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 0 16px;
      background: #ffffff;
      color: #111827;
      font: inherit;
      cursor: pointer;
    }

    button.primary {
      border-color: #2563eb;
      background: #2563eb;
      color: #ffffff;
    }

    button:hover {
      background: #f8fafc;
    }

    button.primary:hover {
      background: #1d4ed8;
    }

    #status {
      min-height: 20px;
      margin-top: 16px;
      color: #64748b;
    }

    #status.success {
      color: #16a34a;
    }

    #status.error {
      color: #ef4444;
    }
  </style>
</head>
<body>
  <main>
    <h1>ContextProxy 扩展设置</h1>

    <label for="receiverHost">上报地址</label>
    <input id="receiverHost" type="text" autocomplete="off" placeholder="127.0.0.1">

    <label for="receiverPort">上报端口</label>
    <input id="receiverPort" type="number" min="1" max="65535" step="1" placeholder="17890">

    <div class="actions">
      <button id="saveButton" class="primary" type="button">保存</button>
      <button id="resetButton" type="button">恢复默认</button>
    </div>

    <div id="status" role="status"></div>
  </main>

  <script src="options.js"></script>
</body>
</html>
